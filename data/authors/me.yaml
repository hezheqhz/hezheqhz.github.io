bio: |
  Zhe He (赫哲) is an Associate Research Fellow at Shandong Institute of
  Advanced Technology. His research focuses on low-temperature precision
  measurement, quantum imaging, and near-field scanning imaging. He achieved
  the first near-field Raman imaging of single-molecule DNA/RNA at room
  temperature and entangled-photon super-resolution imaging at the
  single-cell scale. He has published 20+ first/corresponding-author papers
  in journals including Science Advances, Nature Communications, and JACS,
  and serves as a reviewer for Nature Communications, Physical Review
  Letters, Physical Review B, and Nanophotonics.

